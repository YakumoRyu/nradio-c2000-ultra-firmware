<%+header%>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPENWRT WEBUI</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    #loadingMessage {
      margin-bottom: 20px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: white;
      z-index: 10;
    }

    #embeddedPageContainer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #embeddedPage {
      width: 100%;
      height: 100%;
      border: none;
      transform: translateY(-570px);
    }
  </style>
</head>
<body>
  <h2 style="background-color: rgb(83, 83, 83); color: white;">蜂窝模组Web管理</h2>
  <div id="loadingMessage">正在加载API...</div>
  <div id="embeddedPageContainer">
    <iframe id="embeddedPage" src="" onload="showHalfPage()"></iframe>
  </div>
  <script>
    function showHalfPage() {
      document.getElementById('loadingMessage').style.display = 'none';
      var embeddedPage = document.getElementById('embeddedPage');
      embeddedPage.style.transform = 'translateY(0)';
    }

    function loadIP() {
      // Follow whatever host/IP the browser used to reach LuCI, so the embedded
      // WEBUI adapts automatically to any br-lan IP change. The :8889 SPA is served
      // by uhttpd on 0.0.0.0, so it is reachable on the same host.
      document.getElementById('embeddedPage').src =
        'http://' + window.location.hostname + ':8889/#/network-info';
    }

    window.onload = loadIP;
  </script>
</body>
<%+footer%>
