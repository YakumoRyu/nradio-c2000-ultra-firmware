name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ultra-ports-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - run: python3 tests/test-ultra-ports.py
      - run: python3 tests/test-modem-fields.py
      - run: python3 tests/test-ui-hotfix.py
      - run: lua5.1 tests/test-modem-fields.lua
      - run: lua5.1 tests/test-cpu-sample.lua
      - run: python3 tests/test-usb-watchdog.py
      - run: sh -n overlay/usr/bin/mwrt-qmodem-usb3 && sh -n overlay/www/cgi-bin/router3d-data
      - run: sh -n overlay/usr/libexec/qmodem-at-ubus
  qmodem-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test-qmodem-hotfix.py
      - run: sh -n overlay/usr/share/qmodem/modem_dial.sh
  webui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: packages/at-webserver/src/go.sum
      - run: go test -race -mod=vendor ./...
        working-directory: packages/at-webserver/src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run typecheck && npm run build
        working-directory: webui
      - run: node tests/test-v302-frontend.cjs
