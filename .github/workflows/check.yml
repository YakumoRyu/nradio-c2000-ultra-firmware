name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: packages/at-webserver/src/go.sum
      - run: go test -race -mod=vendor ./...
        working-directory: packages/at-webserver/src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run typecheck && npm run build
        working-directory: webui
      - run: node tests/test-v302-frontend.cjs
